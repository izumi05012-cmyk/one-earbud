<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分你一只耳机 · 网易云登录</title>
<style>
body{margin:0;background:#f6f3f7;color:#2b2830;font-family:"Songti SC","Noto Serif SC",serif}
main{max-width:460px;margin:0 auto;padding:28px 18px}
.oe-title{font-size:22px;margin:0 0 4px}.oe-sub{color:#8f8a95;font-size:13px;margin:0 0 18px}
.oe-card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.oe-label{font-size:13px;color:#8f8a95;margin-bottom:6px}.oe-value{font-size:16px;margin-bottom:8px}
.oe-help{font-size:13px;line-height:1.7;color:#6b6670}
.oe-btn{border:0;border-radius:999px;padding:10px 18px;background:#f0ecf3;color:#2b2830;font:inherit;font-size:14px}
.oe-btn.is-go{background:#d995ad;color:#fff}
.oe-qr{width:220px;height:220px;image-rendering:pixelated;background:#fff;border-radius:12px;padding:8px}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font:inherit;box-sizing:border-box}
</style></head><body><main id="app"></main>
<script>
// 支持网址 ?token=xxx 直接写入 localStorage
(function(){
  var m = location.search.match(/[?&]token=([^&]+)/);
  if (m) localStorage.setItem('one-earbud.token', decodeURIComponent(m[1]));
  if (!localStorage.getItem('one-earbud.token')) {
    document.getElementById('app').innerHTML = '<h1 class="oe-title">输入口令</h1><div class="oe-card"><input id="t" placeholder="ONE_EARBUD_TOKEN" type="password"><br><br><button class="oe-btn is-go" onclick="localStorage.setItem(\'one-earbud.token\',document.getElementById(\'t\').value);location.reload()">登录</button></div>';
    return;
  }
  var s=document.createElement('script'); s.type='module'; s.src='./login.js'; document.body.appendChild(s);
})();
</script>
</body></html>
